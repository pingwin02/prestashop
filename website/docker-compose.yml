version: "3"
services:
  mariadb:
    platform: linux/x86_64
    container_name: mariadb
    image: mariadb:10.5
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=presta_database
      - MYSQL_ROOT_PASSWORD=admin
    ports:
      - 3306
    volumes:
      - ./db_dump:/docker-entrypoint-initdb.d
      - ./database:/var/lib/mysql
    networks:
      - prestashop_network
  prestashop:
    platform: linux/x86_64
    container_name: prestashop
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: root
    environment:
      - PS_DEV_MODE=1
    depends_on:
      - mariadb
    ports:
      - 443:443
      - 8080:80
    volumes:
      - ./src:/var/www/html
    networks:
      - prestashop_network
networks:
  prestashop_network:
