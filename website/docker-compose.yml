version: "3"
services:
  mariadb:
    platform: linux/x86_64
    container_name: mariadb
    image: mariadb:10.5
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=presta_database
      - MYSQL_ROOT_PASSWORD=admin
    ports:
      - 3306:3306
    volumes:
      - ./db_dump:/docker-entrypoint-initdb.d
      - ./database:/var/lib/mysql
    networks:
      - prestashop_network
  prestashop:
    platform: linux/x86_64
    container_name: prestashop
    image: prestashop/prestashop:1.7.8-apache
    restart: unless-stopped
    user: root
    environment:
      - PS_DEV_MODE=1
    depends_on:
      - mariadb
    ports:
      - 443:443
      - 8080:80
    volumes:
      - ./src:/var/www/html
      - ./prestashop.crt:/etc/ssl/certs/prestashop.crt
      - ./prestashop.key:/etc/ssl/private/prestashop.key
      - ./prestashop-ssl.conf:/etc/apache2/sites-available/prestashop-ssl.conf
    command: /bin/bash -c "a2enmod ssl && a2ensite prestashop-ssl && apache2-foreground"
    networks:
      - prestashop_network
  selenium-hub:
    platform: linux/x86_64
    container_name: selenium-hub
    image: selenium/hub:4.15.0-20231102
    restart: unless-stopped
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
  chrome:
    platform: linux/x86_64
    container_name: selenium-chrome
    image: selenium/node-chrome:4.15.0-20231102
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
  mailhog:
    platform: linux/x86_64
    image: mailhog/mailhog
    container_name: 'mailhog'
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - prestashop_network
networks:
  prestashop_network: